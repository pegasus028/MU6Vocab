# Records the Sonia read-aloud clips for any new or changed text and commits them back to main.
# Runs on every push that touches the content, and by hand from the Actions tab ("Run workflow").
name: Record read-aloud audio
on:
  push:
    branches: [main]
    paths: ["data/**", "tts-clean.js", "tools/tts-list.js", "tools/make-audio.py", "!data/tts.js"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record-audio
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install edge-tts and ffmpeg
        run: |
          pip install edge-tts
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Record new or changed clips
        run: python tools/make-audio.py --prune
      - name: Commit clips
        run: |
          git add audio data/tts.js
          if git diff --cached --quiet; then echo "Nothing new to record."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record read-aloud audio (Sonia)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
