<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" class="pa-svg" data-pattern="british">
<title>British health English: four signs, A and E, a GP, the chemist's and a flu jab, beside their American forms</title>
<style>
.pa-bg{fill:var(--paper2,#fcfdfb);stroke:var(--line,#dfe6e0);stroke-width:2}
