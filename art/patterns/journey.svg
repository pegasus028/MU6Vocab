.pa-f-ink{fill:var(--ink,#1b2320)}.pa-f-ink2{fill:var(--ink2,#48544e)}.pa-f-ink3{fill:var(--ink3,#78857e)}.pa-f-line{fill:var(--line,#dfe6e0)}
.pa-f-skin{fill:#f2c9a6}.pa-f-mouse{fill:#ddd6f3}.pa-f-mouth{fill:#6b2f2f}.pa-f-hair{fill:#2f2a2a}.pa-f-cheek{fill:#ef9a86;opacity:.75}.pa-f-bone{fill:#f3ead6}.pa-f-white{fill:#fbfbf8}
.pa-s-ln,.pa-s-g,.pa-s-c,.pa-s-a,.pa-s-l,.pa-s-ink3,.pa-s-card,.pa-s-face,.pa-s-line{stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pa-s-ln{stroke:var(--ink2,#48544e)}.pa-s-g{stroke:var(--green,#1f7a4d)}.pa-s-c{stroke:var(--coral,#e4572e)}.pa-s-a{stroke:var(--amber,#c8902a)}
.pa-s-l{stroke:var(--lav,#6c5fb5)}.pa-s-ink3{stroke:var(--ink3,#78857e)}.pa-s-card{stroke:var(--card,#fff)}.pa-s-face{stroke:#2f2a2a}.pa-s-line{stroke:var(--line,#dfe6e0)}
.pa-w3{stroke-width:3}.pa-w4{stroke-width:4}.pa-dash{stroke-dasharray:6 5}
.pa-arm-o{fill:none;stroke:var(--ink2,#48544e);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.pa-arm{fill:none;stroke:#f2c9a6;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.pa-road{fill:none;stroke:var(--line,#dfe6e0);stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.pa-t{font-family:var(--sans,"Atkinson Hyperlegible",system-ui,sans-serif);fill:var(--ink,#1b2320);font-weight:700}
.pa-t2{font-family:var(--sans,"Atkinson Hyperlegible",system-ui,sans-serif);fill:var(--ink2,#48544e);font-weight:400}
.pa-t3{font-family:var(--sans,"Atkinson Hyperlegible",system-ui,sans-serif);fill:var(--ink3,#78857e);font-weight:400}
.pa-tg{fill:var(--green,#1f7a4d)}.pa-tc{fill:var(--coral,#e4572e)}.pa-ta{fill:var(--amber,#c8902a)}.pa-tl{fill:var(--lav,#6c5fb5)}.pa-tf{fill:#2f2a2a}
.pa-tnum{fill:var(--card,#fff)}.pa-strike{text-decoration:line-through}.pa-faint{opacity:.32}
</style>
