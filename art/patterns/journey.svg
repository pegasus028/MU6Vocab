reatment</text><circle class="pa-f-card pa-s-g pa-w3" cx="110" cy="176" r="30"/><g transform="translate(110 176)"><rect class="pa-f-card pa-s-ln" x="-11" y="-21" width="10" height="34" rx="5"/><rect class="pa-f-G" x="-8" y="2" width="4" height="9" rx="2"/><circle class="pa-f-G pa-s-ln" cx="-6" cy="15" r="7.5"/><path class="pa-f-none pa-s-g pa-w3" d="M11 -16 V8 M5 2 L11 9 L17 2"/></g><circle class="pa-f-G" cx="85" cy="153" r="12"/><text class="pa-t pa-tnum" x="85" y="158.5" font-size="16" text-anchor="middle">6</text><text class="pa-t" x="110" y="229" font-size="20" text-anchor="middle">Effect</text><circle class="pa-f-card pa-s-g pa-w3" cx="110" cy="288" r="30"/><g transform="translate(110 288)"><rect class="pa-f-ink2" x="-14" y="-2.5" width="28" height="5" rx="2"/><rect class="pa-f-G pa-s-ln" x="-22" y="-11" width="9" height="22" rx="3"/><rect class="pa-f-G pa-s-ln" x="13" y="-11" width="9" height="22" rx="3"/></g><circle class="pa-f-G" cx="85" cy="265" r="12"/><text class="pa-t pa-tnum" x="85" y="270.5" font-size="16" text-anchor="middle">7</text><text class="pa-t" x="110" y="341" font-size="20" text-anchor="middle">Rehab</text><circle class="pa-f-card pa-s-g pa-w3" cx="320" cy="288" r="30"/><g transform="translate(320 288)"><g transform="translate(0 3) scale(0.82)"><rect class="pa-f-hair pa-s-ln" x="-24" y="-24" width="48" height="47" rx="20"/><circle class="pa-f-skin pa-s-ln" cx="0" cy="0" r="19"/><path class="pa-f-hair" d="M-19.5 -2 C-20 -21 20 -21 19.5 -2 C13 -9 6 -7 0 -12 C-6 -7 -13 -9 -19.5 -2 Z"/><path class="pa-f-C" d="M13 -19 l-7 -6 v12 z M13 -19 l7 -6 v12 z"/><circle class="pa-f-C" cx="13" cy="-19" r="2.6"/><circle class="pa-f-cheek" cx="-11" cy="8" r="3.6"/><circle class="pa-f-cheek" cx="11" cy="8" r="3.6"/><circle class="pa-f-hair" cx="-7" cy="2" r="2.4"/><circle class="pa-f-hair" cx="7" cy="2" r="2.4"/><path class="pa-f-none pa-s-face" d="M-7 8.5 Q0 15.5 7 8.5"/></g></g><circle class="pa-f-G" cx="295" cy="265" r="12"/><text class="pa-t pa-tnum" x="295" y="270.5" font-size="16" text-anchor="middle">8</text><text class="pa-t" x="320" y="341" font-size="20" text-anchor="middle">Outcome</text><circle class="pa-f-card pa-s-g pa-w3" cx="530" cy="288" r="30"/><g transform="translate(530 288)"><path class="pa-f-g pa-s-g" d="M0 -21 L17 -14 V0 Q17 14 0 21 Q-17 14 -17 0 V-14 Z"/><rect class="pa-f-card pa-s-ln" x="-5" y="-8" width="10" height="18" rx="3"/><rect class="pa-f-L" x="-6" y="-12" width="12" height="5" rx="1.5"/><rect class="pa-f-l" x="-3" y="1" width="6" height="7" rx="1"/></g><circle class="pa-f-G" cx="505" cy="265" r="12"/><text class="pa-t pa-tnum" x="505" y="270.5" font-size="16" text-anchor="middle">9</text><text class="pa-t" x="530" y="341" font-size="20" text-anchor="middle">Prevention</text>
</svg>
