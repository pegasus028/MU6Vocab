.pa-f-g{fill:var(--green-bg,#def2e6)}.pa-f-G{fill:var(--green,#1f7a4d)}
.pa-f-c{fill:var(--coral-bg,#fde6de)}.pa-f-C{fill:var(--coral,#e4572e)}
.pa-f-a{fill:var(--amber-bg,#fbefd4)}.pa-f-A{fill:var(--amber,#c8902a)}
