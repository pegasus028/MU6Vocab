<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" class="pa-svg" data-pattern="layers">
<title>The body in layers: surface, bones and joints, organs and muscle</title>
<style>
.pa-bg{fill:var(--paper2,#fcfdfb);stroke:var(--line,#dfe6e0);stroke-width:2}
