 y="188" width="196" height="62" rx="12"/><path class="pa-f-none pa-s-card pa-w3" d="M436 204 Q438 197 448 196" opacity=".9"/><g transform="translate(609 201)"><path class="pa-f-none pa-s-l" d="M0 -7 V7 M-6 -3.5 L6 3.5 M-6 3.5 L6 -3.5"/></g><text class="pa-t" x="524" y="226" font-size="20" text-anchor="middle">come <tspan class="pa-tc">down with</tspan></text><rect class="pa-f-l pa-s-l" x="18" y="268" width="196" height="62" rx="12"/><path class="pa-f-none pa-s-card pa-w3" d="M28 284 Q30 277 40 276" opacity=".9"/><g transform="translate(201 281)"><path class="pa-f-none pa-s-l" d="M0 -7 V7 M-6 -3.5 L6 3.5 M-6 3.5 L6 -3.5"/></g><text class="pa-t" x="116" y="306" font-size="20" text-anchor="middle">full <tspan class="pa-tc">of</tspan> beans</text><rect class="pa-f-l pa-s-l" x="222" y="268" width="196" height="62" rx="12"/><path class="pa-f-none pa-s-card pa-w3" d="M232 284 Q234 277 244 276" opacity=".9"/><g transform="translate(405 281)"><path class="pa-f-none pa-s-l" d="M0 -7 V7 M-6 -3.5 L6 3.5 M-6 3.5 L6 -3.5"/></g><text class="pa-t" x="320" y="306" font-size="20" text-anchor="middle">pull <tspan class="pa-tc">through</tspan></text><rect class="pa-f-l pa-s-l" x="426" y="268" width="196" height="62" rx="12"/><path class="pa-f-none pa-s-card pa-w3" d="M436 284 Q438 277 448 276" opacity=".9"/><g transform="translate(609 281)"><path class="pa-f-none pa-s-l" d="M0 -7 V7 M-6 -3.5 L6 3.5 M-6 3.5 L6 -3.5"/></g><text class="pa-t" x="524" y="306" font-size="20" text-anchor="middle">back <tspan class="pa-tc">on</tspan> your feet</text>
