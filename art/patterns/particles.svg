.pa-arm{fill:none;stroke:#f2c9a6;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.pa-road{fill:none;stroke:var(--line,#dfe6e0);stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.pa-t{font-family:var(--sans,"Atkinson Hyperlegible",system-ui,sans-serif);fill:var(--ink,#1b2320);font-weight:700}
.pa-t2{font-family:var(--sans,"Atkinson Hyperlegible",system-ui,sans-serif);fill:var(--ink2,#48544e);font-weight:400}
.pa-t3{font-family:var(--sans,"Atkinson Hyperlegible",system-ui,sans-serif);fill:var(--ink3,#78857e);font-weight:400}
.pa-tg{fill:var(--green,#1f7a4d)}.pa-tc{fill:var(--coral,#e4572e)}.pa-ta{fill:var(--amber,#c8902a)}.pa-tl{fill:var(--lav,#6c5fb5)}.pa-tf{fill:#2f2a2a}
.pa-tnum{fill:var(--card,#fff)}.pa-strike{text-decoration:line-through}.pa-faint{opacity:.32}
</style>
