<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" class="pa-svg" data-pattern="particles">
<title>Frozen idioms, moving particles: the grammar around an idiom moves, the idiom and its particle stay frozen in ice</title>
<style>
