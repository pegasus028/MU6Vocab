<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" class="pa-svg" data-pattern="thermometer">
<title>The idiom thermometer: nine expressions from on top of the world down to black out, with a recovery ladder</title>
<style>
.pa-bg{fill:var(--paper2,#fcfdfb);stroke:var(--line,#dfe6e0);stroke-width:2}
.pa-f-card{fill:var(--card,#fff)}.pa-f-paper{fill:var(--paper,#f6f8f4)}.pa-f-none{fill:none}
.pa-f-g{fill:var(--green-bg,#def2e6)}.pa-f-G{fill:var(--green,#1f7a4d)}
.pa-f-c{fill:var(--coral-bg,#fde6de)}.pa-f-C{fill:var(--coral,#e4572e)}
.pa-f-a{fill:var(--amber-bg,#fbefd4)}.pa-f-A{fill:var(--amber,#c8902a)}
.pa-f-l{fill:var(--lav-bg,#ebe7f8)}.pa-f-L{fill:var(--lav,#6c5fb5)}
.pa-f-ink{fill:var(--ink,#1b2320)}.pa-f-ink2{fill:var(--ink2,#48544e)}.pa-f-ink3{fill:var(--ink3,#78857e)}.pa-f-line{fill:var(--line,#dfe6e0)}
.pa-f-skin{fill:#f2c9a6}.pa-f-mouse{fill:#ddd6f3}.pa-f-mouth{fill:#6b2f2f}.pa-f-hair{fill:#2f2a2a}.pa-f-cheek{fill:#ef9a86;opacity:.75}.pa-f-bone{fill:#f3ead6}.pa-f-white{fill:#fbfbf8}
.pa-s-ln,.pa-s-g,.pa-s-c,.pa-s-a,.pa-s-l,.pa-s-ink3,.pa-s-card,.pa-s-face,.pa-s-line{stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pa-s-ln{stroke:var(--ink2,#48544e)}.pa-s-g{stroke:var(--green,#1f7a4d)}.pa-s-c{stroke:var(--coral,#e4572e)}.pa-s-a{stroke:var(--amber,#c8902a)}
.pa-s-l{stroke:var(--lav,#6c5fb5)}.pa-s-ink3{stroke:var(--ink3,#78857e)}.pa-s-card{stroke:var(--card,#fff)}.pa-s-face{stroke:#2f2a2a}.pa-s-line{stroke:var(--line,#dfe6e0)}
.pa-w3{stroke-width:3}.pa-w4{stroke-width:4}.pa-dash{stroke-dasharray:6 5}
.pa-arm-o{fill:none;stroke:var(--ink2,#48544e);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.pa-arm{fill:none;stroke:#f2c9a6;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.pa-road{fill:none;stroke:var(--line,#dfe6e0);stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.pa-t{font-family:var(--sans,"Atkinson Hyperlegible",system-ui,sans-serif);fill:var(--ink,#1b2320);font-weight:700}
.pa-t2{font-family:var(--sans,"Atkinson Hyperlegible",system-ui,sans-serif);fill:var(--ink2,#48544e);font-weight:400}
.pa-t3{font-family:var(--sans,"Atkinson Hyperlegible",system-ui,sans-serif);fill:var(--ink3,#78857e);font-weight:400}
.pa-tg{fill:var(--green,#1f7a4d)}.pa-tc{fill:var(--coral,#e4572e)}.pa-ta{fill:var(--amber,#c8902a)}.pa-tl{fill:var(--lav,#6c5fb5)}.pa-tf{fill:#2f2a2a}
.pa-tnum{fill:var(--card,#fff)}.pa-strike{text-decoration:line-through}.pa-faint{opacity:.32}
</style>
<rect class="pa-bg" x="1" y="1" width="638" height="358" rx="22"/>
<rect class="pa-f-card pa-s-ln" x="282" y="20" width="36" height="290" rx="18"/><rect class="pa-f-G" x="290" y="28.25" width="20" height="26.5" rx="9" opacity=".85"/><rect class="pa-f-G" x="290" y="56.75" width="20" height="29.5" rx="3" opacity=".85"/><rect class="pa-f-G" x="290" y="88.25" width="20" height="29.5" rx="3" opacity=".85"/><rect class="pa-f-G" x="290" y="119.75" width="20" height="29.5" rx="3" opacity=".85"/><rect class="pa-f-A" x="290" y="151.25" width="20" height="29.5" rx="3" opacity=".85"/><rect class="pa-f-A" x="290" y="182.75" width="20" height="29.5" rx="3" opacity=".85"/><rect class="pa-f-C" x="290" y="214.25" width="20" height="29.5" rx="3" opacity=".85"/><rect class="pa-f-C" x="290" y="245.75" width="20" height="29.5" rx="3" opacity=".85"/><rect class="pa-f-C" x="290" y="277.25" width="20" height="29.5" rx="3" opacity=".85"/><circle class="pa-f-C pa-s-ln" cx="300" cy="320" r="24"/><rect class="pa-f-C" x="290" y="300" width="20" height="14"/><path class="pa-f-none pa-s-ln" d="M318 40 H334"/><text class="pa-t" x="344" y="47" font-size="20">on top of the world</text><path class="pa-f-none pa-s-ln" d="M318 71.5 H334"/><text class="pa-t" x="344" y="78.5" font-size="20">full of beans</text><path class="pa-f-none pa-s-ln" d="M318 103 H334"/><text class="pa-t" x="344" y="110" font-size="20">the picture of health</text><path class="pa-f-none pa-s-ln" d="M318 134.5 H334"/><text class="pa-t" x="344" y="141.5" font-size="20">in shape</text><path class="pa-f-none pa-s-ln" d="M318 166 H334"/><text class="pa-t" x="344" y="173" font-size="20">out of shape</text><path class="pa-f-none pa-s-ln" d="M318 197.5 H334"/><text class="pa-t" x="344" y="204.5" font-size="20">under the weather</text><path class="pa-f-none pa-s-ln" d="M318 229 H334"/><text class="pa-t" x="344" y="236" font-size="20">come down with</text><path class="pa-f-none pa-s-ln" d="M318 260.5 H334"/><text class="pa-t" x="344" y="267.5" font-size="20">on your last legs</text><path class="pa-f-none pa-s-ln" d="M318 292 H334"/><text class="pa-t" x="344" y="299" font-size="20">black out</text><rect class="pa-f-l pa-s-l" x="550" y="27" width="72" height="26" rx="13"/><text class="pa-t pa-tl" x="586" y="46" font-size="16" text-anchor="middle">mood</text><rect class="pa-f-l pa-s-l" x="478" y="153" width="84" height="26" rx="13"/><text class="pa-t pa-tl" x="520" y="172" font-size="16" text-anchor="middle">fitness</text><text class="pa-t pa-tg" x="232" y="50" font-size="20" text-anchor="middle">Recovery</text><path class="pa-f-none pa-s-g pa-w3" d="M214 300 V80 M250 300 V80"/><path class="pa-f-none pa-s-g" d="M214 290 H250"/><path class="pa-f-none pa-s-g" d="M214 265 H250"/><path class="pa-f-none pa-s-g" d="M214 240 H250"/><path class="pa-f-none pa-s-g" d="M214 215 H250"/><path class="pa-f-none pa-s-g" d="M214 190 H250"/><path class="pa-f-none pa-s-g" d="M214 165 H250"/><path class="pa-f-none pa-s-g" d="M214 140 H250"/><path class="pa-f-none pa-s-g" d="M214 115 H250"/><path class="pa-f-none pa-s-g" d="M214 90 H250"/><path class="pa-f-g pa-s-g" d="M232 60 L250 78 H214 Z"/><circle class="pa-f-G" cx="214" cy="274" r="5"/><text class="pa-t" x="202" y="281" font-size="19" text-anchor="end">pull through</text><circle class="pa-f-G" cx="214" cy="190" r="5"/><text class="pa-t" x="202" y="197" font-size="19" text-anchor="end">up and about</text><circle class="pa-f-G" cx="214" cy="106" r="5"/><text class="pa-t" x="202" y="113" font-size="19" text-anchor="end">back on your feet</text>
</svg>
