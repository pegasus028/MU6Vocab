" font-size="20" text-anchor="middle">come <tspan class="pa-tc">down</tspan> with</text><rect class="pa-f-c pa-s-c" x="364" y="241" width="256" height="38" rx="19"/><text class="pa-t" x="492" y="267" font-size="20" text-anchor="middle"><tspan class="pa-tc">under</tspan> the weather</text><rect class="pa-f-c pa-s-c" x="364" y="287" width="256" height="38" rx="19"/><text class="pa-t" x="492" y="313" font-size="20" text-anchor="middle">black <tspan class="pa-tc">out</tspan></text>
