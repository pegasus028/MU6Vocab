<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" class="pa-svg" data-pattern="updown">
<title>Healthy is up, ill is down: a happy girl at the top of an arrow, an ill girl in bed at the bottom</title>
<style>
